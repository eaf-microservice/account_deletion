<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deletion Request</title>
    <meta name="description"
        content="Request the deletion of your account and associated data for our Google Play applications.">
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="card" id="formCard">
            <header>
                <h1>Account Deletion</h1>
                <p class="subtitle">Please select your application to view its specific account and data deletion
                    instructions.</p>
            </header>

            <form id="deletionForm">
                <div class="form-group">
                    <label for="application">Select Your Application</label>
                    <select id="application" required>
                        <option value="" disabled selected>Select from list</option>
                        <option value="daret">Daret</option>
                        <option value="clementines_cafe">Clementine's Cafe</option>

                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="confirmDeletion" required>
                    <label for="confirmDeletion">
                        I understand that I am being redirected to specific instructions for my selected app.
                    </label>
                </div>

                <button type="submit" id="submitBtn">
                    View Deletion Instructions
                </button>
            </form>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>

</html>
